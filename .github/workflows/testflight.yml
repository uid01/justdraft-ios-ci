name: TestFlight
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    steps:
      - run: echo "macos hosted runner is available"
  ios:
    needs: probe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: uid01/justdraft-mobile0
          token: ${{ secrets.MOBILE_REPO_TOKEN }}
          ref: cursor/justdraft-api-client-add3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build web
        env:
          VITE_JUSTDRAFT_API_URL: https://just-draft.com
        run: |
          npm ci
          npm run build
      - name: Capacitor iOS
        run: |
          npm install --save-dev @capacitor/cli
          npx cap add ios || true
          npx cap sync ios
      - name: Fastlane TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install fastlane --no-document
          fastlane beta
