name: TestFlight
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - run: echo "macos-26 hosted runner is available"
  ios:
    needs: probe
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          repository: uid01/justdraft-mobile0
          token: ${{ secrets.MOBILE_REPO_TOKEN }}
          ref: cursor/justdraft-api-client-add3
      - name: Select Xcode 26
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$latest" ] && latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build web
        env:
          VITE_JUSTDRAFT_API_URL: https://just-draft.com
        run: |
          npm ci
          npm run build
      - name: Capacitor iOS
        run: |
          npm install --save-dev @capacitor/cli@7.6.9
          npx cap add ios || true
          npx cap sync ios
          bash scripts/apply-ios-icon.sh
          find ios -name '*.xcworkspace' -o -name '*.xcodeproj' -o -name Podfile
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install)
          fi
      - name: Verify App Store Connect Transporter login
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --list-apps -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD" || true
      - name: Fastlane TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ITC_APP_ID: ${{ secrets.ITC_APP_ID }}
        run: |
          gem install fastlane --no-document
          fastlane beta
